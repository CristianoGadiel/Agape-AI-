<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÁGAPE V36</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { text-align: center; border-bottom: 1px solid #0f0; padding-bottom: 10px; margin-bottom: 20px; }
        #chat { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px; padding: 10px; border: 1px solid #333; }
        #input-area { display: flex; gap: 10px; background: #000; padding: 10px 0; }
        #cmd { flex-grow: 1; background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0a0; }
        .user { color: #00ff00; margin-top: 10px; }
        .ai { color: #ffffff; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="header">
        <h1>AGAPE V36 - ONLINE</h1>
        <p style="font-size: 0.8em;">Status: Conectado ao Gemini Pro | Malha: 72160 nós</p>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <span>>> </span>
        <input type="text" id="cmd" placeholder="Digite sua diretriz ética..." autocomplete="off">
        <button onclick="enviar()">EXECUTE</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('cmd');

        async function enviar() {
            const pergunta = input.value;
            if (!pergunta) return;

            // Mostra o que você digitou
            chat.innerHTML += `<div class="user"><b>VOCÊ:</b> ${pergunta}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta: pergunta })
                });
                
                const data = await res.json();
                chat.innerHTML += `<div class="ai"><b>ÁGAPE:</b> ${data.resposta}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="ai" style="color: red;"><b>ERRO:</b> Falha na conexão com o núcleo.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        // Permite apertar Enter para enviar
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                enviar();
            }
        });
    </script>
</body>
</html>
