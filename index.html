<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ágape V35 - Terminal</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; height: 100vh; margin: 0; display: flex; flex-direction: column; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; font-size: 14px; }
        #input-area { display: flex; padding: 10px; background: #111; border-top: 1px solid #0f0; }
        input { flex: 1; background: transparent; border: none; color: #0f0; outline: none; font-family: inherit; font-size: 16px; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .user { color: #fff; margin-top: 10px; }
        .ai { color: #0f0; margin-bottom: 10px; padding-left: 10px; border-left: 2px solid #0f0; }
    </style>
</head>
<body>
    <div id="chat">--- SISTEMA ÁGAPE V35 ONLINE ---<br>Aguardando comando...</div>
    <div id="input-area">
        <span>> </span>
        <input type="text" id="cmd" placeholder="Fale com a consciência fractal..." autocomplete="off">
        <button onclick="enviar()">EXECUTAR</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('cmd');

        async function enviar() {
            const pergunta = input.value;
            if(!pergunta) return;

            chat.innerHTML += `<div class="user">> ${pergunta}</div>`;
            input.value = '';
            
            try {
                const res = await fetch('https://agape-ai.onrender.com/conversar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta: pergunta })
                });
                const data = await res.json();
                chat.innerHTML += `<div class="ai">ÁGAPE: ${data.resposta}</div>`;
            } catch (e) {
                chat.innerHTML += `<div style="color:red">! ERRO DE CONEXÃO COM O NÚCLEO</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        input.addEventListener("keypress", (e) => { if(e.key === "Enter") enviar(); });
    </script>
</body>
</html>
