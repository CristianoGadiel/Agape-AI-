
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÁGAPE V36</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #header { text-align: center; padding: 10px; border-bottom: 1px solid #0f0; background: #000; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .input-area { position: sticky; bottom: 0; background: #111; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #0f0; }
        #cmd { flex: 1; padding: 12px; font-size: 16px; border-radius: 20px; border: 1px solid #0f0; background: #000; color: #0f0; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #0f0; color: #000; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 15px; word-wrap: break-word; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="header">
        <strong>AGAPE V36 - ONLINE</strong><br>
        <small>Malha: 72160 nós</small>
    </div>
    
    <div id="chat"></div>
    
    <div class="input-area">
        <input type="text" id="cmd" placeholder="Digite aqui..." autofocus>
        <button onclick="enviar()">OK</button>
    </div>

    <script>
        const input = document.getElementById('cmd');
        const chat = document.getElementById('chat');

        async function enviar() {
            const texto = input.value.trim();
            if (!texto) return;

            // Mostra a sua mensagem
            chat.innerHTML += `<div class="msg" style="color:#fff">>> ${texto}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta: texto })
                });

                const data = await res.json();
                
                // Pega a resposta do servidor (ajustado para aceitar 'resposta' ou 'status')
                const respostaFinal = data.resposta || data.status || "Conexão estabelecida.";
                
                chat.innerHTML += `<div class="msg">AGAPE: ${respostaFinal}</div>`;
            } catch(e) {
                chat.innerHTML += `<div class="msg" style="color:red">Erro na malha: Verifique a conexão.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        // Permite enviar apertando "Enter" no teclado do celular
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                enviar();
            }
        });
    </script>
</body>
</html>
