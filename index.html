<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ÁGAPE V36</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { text-align: center; padding: 10px; border-bottom: 1px solid #333; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; }
        .input-area { position: sticky; bottom: 0; background: #111; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #333; }
        #cmd { flex: 1; padding: 12px; font-size: 16px; border-radius: 20px; border: 1px solid #0f0; background: #000; color: #0f0; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #0f0; color: #000; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 15px; word-wrap: break-word; }
    </style>
</head>
<body>
    <div id="header">
        <strong>AGAPE V36 - ONLINE</strong><br>
        <small>Malha: 72160 nós</small>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="cmd" placeholder="Digite aqui..." autofocus>
        <button onclick="enviar()">OK</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('cmd');
            const chat = document.getElementById('chat');
            if(!input.value) return;

            chat.innerHTML += `<div class="msg" style="color:#fff">>> ${input.value}</div>`;
            const texto = input.value;
            input.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pergunta: texto})
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg">AGAPE: ${data.resposta}</div>`;
            } catch(e) {
                chat.innerHTML += `<div class="msg" style="color:red">Erro de conexão.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
